<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#151B28" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E2638" stroke-width="4" />

  <!-- Outer Dial Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E2638" stroke-width="12" stroke-dasharray="6 8" />

  <!-- Session Track - Sydney / Tokyo / London / NY representations -->
  <!-- Track Base -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#161F30" stroke-width="16" />

  <!-- Active Session Arc 1 (Emerald - Open Session) -->
  <path d="M 256 116 A 140 140 0 0 1 396 256" fill="none" stroke="url(#emerald-glow)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />

  <!-- Overlap Session Arc (Amber - London/NY Overlap) -->
  <path d="M 396 256 A 140 140 0 0 1 330 365" fill="none" stroke="url(#amber-glow)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Cyan Tracker Indicator Arc -->
  <path d="M 180 376 A 140 140 0 0 1 116 256" fill="none" stroke="url(#cyan-accent)" stroke-width="14" stroke-linecap="round" opacity="0.8" />

  <!-- Center Hub with Pulse -->
  <circle cx="256" cy="256" r="64" fill="#0E131E" stroke="#1E2638" stroke-width="6" />
  <circle cx="256" cy="256" r="32" fill="#10B981" opacity="0.2" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#10B981" />

  <!-- Chronometer Needles -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#F1F5F9" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="256" x2="335" y2="285" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="256" x2="200" y2="256" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />

  <!-- Dial markers -->
  <circle cx="256" cy="76" r="5" fill="#10B981" />
  <circle cx="436" cy="256" r="5" fill="#F59E0B" />
  <circle cx="256" cy="436" r="5" fill="#64748B" />
  <circle cx="76" cy="256" r="5" fill="#06B6D4" />
</svg>
